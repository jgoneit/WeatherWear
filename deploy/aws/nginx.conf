limit_req_zone $binary_remote_addr zone=demo_api:10m rate=20r/s;
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 16k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location = /healthz { access_log off; return 200 "ok"; }
  location = /api/demo/scenarios {
    limit_except GET { deny all; }
    proxy_pass http://backend:8000;
  }
  location = /api/demo/scenarios/selected {
    limit_except PUT { deny all; }
    limit_req zone=demo_api burst=10 nodelay;
    proxy_pass http://backend:8000;
  }
  # Public visitors can choose demo weather, but cannot trigger scans/recompute.
  location /api/demo/ { return 404; }
  location /api/ {
    limit_req zone=demo_api burst=40 nodelay;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control no-cache;
    try_files $uri /index.html;
  }
}
